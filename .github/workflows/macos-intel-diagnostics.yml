name: macOS Intel Diagnostics

on:
  push:
    paths-ignore:
    - 'README.md'
    - 'docs/'
  pull_request:
    paths-ignore:
    - 'README.md'
    - 'docs/'

jobs:
  diagnostics:
    runs-on: macos-15-intel
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true
    - name: Verify native libraries
      run: |
        ls -lh libs/Native/Aardvark.Embree/mac/AMD64/
        file libs/Native/Aardvark.Embree/mac/AMD64/libembree4.dylib
        otool -L libs/Native/Aardvark.Embree/mac/AMD64/libembree4.dylib
        uname -m
    - name: Install Dotnet
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
    - name: Restore Tools
      run: dotnet tool restore
    - name: Restore Dependencies
      run: dotnet paket restore
    - name: Build Diagnostics
      run: dotnet build src/Aardvark.Embree.Diagnostics.Tests/Aardvark.Embree.Diagnostics.Tests.csproj --configuration Debug
    - name: Build Main Tests
      run: dotnet build src/Aardvark.Embree.Tests/Aardvark.Embree.Tests.csproj --configuration Debug
    - name: Run Diagnostics Tests
      run: |
        set +e
        dotnet test src/Aardvark.Embree.Tests/Aardvark.Embree.Tests.csproj --no-build --configuration Debug --logger "console;verbosity=detailed" --filter "FullyQualifiedName~DirectInstanceTestHeapAlloc" > test_output_main_heap.txt 2>&1
        MAIN_HEAP_EXIT_CODE=$?
        cat test_output_main_heap.txt
        echo "Main HeapAlloc test exit code: $MAIN_HEAP_EXIT_CODE"

        dotnet test src/Aardvark.Embree.Diagnostics.Tests/Aardvark.Embree.Diagnostics.Tests.csproj --no-build --configuration Debug --logger "console;verbosity=detailed" --filter "FullyQualifiedName~WrapperInstanceIntersect" > test_output_wrapper.txt 2>&1
        WRAPPER_EXIT_CODE=$?
        cat test_output_wrapper.txt
        echo "Wrapper test exit code: $WRAPPER_EXIT_CODE"

        dotnet test src/Aardvark.Embree.Diagnostics.Tests/Aardvark.Embree.Diagnostics.Tests.csproj --no-build --configuration Debug --logger "console;verbosity=detailed" --filter "FullyQualifiedName~DirectInstanceIntersect_StackAllocated" > test_output_stack.txt 2>&1
        STACK_EXIT_CODE=$?
        cat test_output_stack.txt
        echo "StackAlloc test exit code: $STACK_EXIT_CODE"

        dotnet test src/Aardvark.Embree.Diagnostics.Tests/Aardvark.Embree.Diagnostics.Tests.csproj --no-build --configuration Debug --logger "console;verbosity=detailed" --filter "FullyQualifiedName~DirectInstanceIntersect_HeapAligned" > test_output_heap_aligned.txt 2>&1
        HEAP_ALIGNED_EXIT_CODE=$?
        cat test_output_heap_aligned.txt
        echo "HeapAligned test exit code: $HEAP_ALIGNED_EXIT_CODE"

        dotnet test src/Aardvark.Embree.Diagnostics.Tests/Aardvark.Embree.Diagnostics.Tests.csproj --no-build --configuration Debug --logger "console;verbosity=detailed" --filter "FullyQualifiedName~DirectInstanceIntersect_HeapAligned_NoCleanup" > test_output_heap_aligned_nocleanup.txt 2>&1
        HEAP_ALIGNED_NOCLEANUP_EXIT_CODE=$?
        cat test_output_heap_aligned_nocleanup.txt
        echo "HeapAligned NoCleanup exit code: $HEAP_ALIGNED_NOCLEANUP_EXIT_CODE"

        dotnet test src/Aardvark.Embree.Diagnostics.Tests/Aardvark.Embree.Diagnostics.Tests.csproj --no-build --configuration Debug --logger "console;verbosity=detailed" --filter "FullyQualifiedName~DirectInstanceIntersect_HeapAllocated" > test_output_heap.txt 2>&1
        HEAP_EXIT_CODE=$?
        cat test_output_heap.txt
        echo "HeapAlloc test exit code: $HEAP_EXIT_CODE"
        exit 0
      env:
        DYLD_LIBRARY_PATH: ${{ github.workspace }}/libs/Native/Aardvark.Embree/mac/AMD64:$DYLD_LIBRARY_PATH
